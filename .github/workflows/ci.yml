name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: gravitas_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test            # unit + database/RLS tests (resets the test DB)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e    # end-to-end tests per role
      - run: npm run build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gravitas_test
          SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          HASH_PEPPER: ci-pepper
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: test-results, retention-days: 7 }
